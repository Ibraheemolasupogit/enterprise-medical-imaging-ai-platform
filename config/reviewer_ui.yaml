config_name: reviewer_ui
milestone: 12
status: foundation
purpose: Local Streamlit reviewer interface for governed API evidence and synthetic-only outputs.
owner: platform-engineering
settings:
  reviewer_ui:
    policy_version: "m12-reviewer-ui-v1"
    page_title: "Enterprise Medical Imaging AI Reviewer"
    page_icon: ":material/radiology:"
    layout: wide
    api_base_url: "http://127.0.0.1:8000"
    request_timeout_seconds: 10
    allowed_upload_extensions:
      - ".npy"
      - ".json"
    maximum_upload_bytes: 1048576
    maximum_review_items: 25
    enable_segmentation_page: true
    enable_classification_page: true
    enable_longitudinal_page: true
    enable_evidence_page: true
    enable_governance_page: true
    allow_local_array_upload: true
    allow_evidence_export: true
    allow_remote_api: false
    allow_remote_bind: false
    host: "127.0.0.1"
    port: 8501
    review_output_directory: reports/generated/reviewer-sessions
    show_debug_details: false
safeguards:
  - The reviewer UI is local-only by default and depends on the governed FastAPI service.
  - The UI must not execute model inference directly or connect to clinical systems.
  - Review exports are engineering artefacts only and remain ignored by Git.
future_capabilities:
  - Authenticated human-review dashboard after governance review.
  - Persistent audit logging and monitoring in later MLOps milestones.
  - Deployment packaging in future container and cloud milestones.
