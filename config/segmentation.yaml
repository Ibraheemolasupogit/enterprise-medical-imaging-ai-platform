config_name: segmentation
milestone: 8
status: foundation
purpose: Synthetic lesion segmentation engineering baseline using a small MONAI 3D U-Net.
owner: machine-learning
settings:
  segmentation:
    policy_version: "m8-segmentation-v1"
    random_seed: 20260724
    device: cpu
    input_shape: [32, 32, 32]
    batch_size: 2
    num_workers: 0
    epochs: 2
    learning_rate: 0.001
    weight_decay: 0.0
    optimizer: adam
    loss: dice_bce
    dice_weight: 0.5
    bce_weight: 0.5
    channels: [4, 8, 16]
    strides: [2, 2]
    num_res_units: 1
    augmentation:
      enabled: true
      flip_probability: 0.2
      noise_std: 0.01
    early_stopping_patience: 2
    threshold: 0.95
    minimum_component_voxels: 2
    keep_largest_component: false
    fill_holes: true
    minimum_validation_dice: 0.0
    minimum_test_recall: 0.0
    maximum_false_positive_voxels: 32768
    maximum_relative_volume_error: 100.0
    dataset_output_directory: ml/datasets/segmentation
    output_directory: ml/experiments/segmentation
    overwrite: false
safeguards:
  - The model is trained only on synthetic engineering lesion masks.
  - Synthetic Dice and recall do not demonstrate clinical segmentation performance.
  - Generated checkpoints and experiment artefacts must remain ignored by Git.
future_capabilities:
  - Public de-identified dataset adapters with documented provenance.
  - Stronger MONAI segmentation models after governance review.
  - Human-review segmentation overlays.
