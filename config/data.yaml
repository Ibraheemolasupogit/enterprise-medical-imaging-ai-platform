config_name: data
milestone: 1
status: planned_not_implemented
purpose: Placeholder structure for future safe dataset handling.
owner: data-governance
settings:
  allowed_data_categories:
    - synthetic
    - publicly_available_deidentified
  disallowed_data_categories:
    - identifiable_patient_data
    - restricted_patient_data_without_governance
  storage_policy: no_real_data_in_git
  synthetic_data:
    dataset_id: synthetic-ct-engineering-fixtures
    dataset_version: "0.2.0"
    manifest_version: "1.0"
    output_root: data/synthetic/generated
    dataset_size: 6
    random_seed: 20260724
    volume_shape:
      - 32
      - 32
      - 32
    voxel_spacing_mm:
      - 2.5
      - 2.5
      - 2.5
    noise_std_hu: 8.0
    adrenal_radius_voxels: 4
    lesion_radius_voxels: 2
    lesion_intensity_hu: 95.0
    scenarios:
      - stable
      - increased
      - reduced
      - new
      - resolved
      - translated
    split_ratios:
      train: 0.5
      validation: 0.25
      test: 0.25
    generator_version: synthetic-generator-v0.2.0
  dicom_ingestion:
    input_dir: data/dicom/input
    output_dir: data/dicom/deidentified
    audit_output_dir: data/dicom/audit
    fixture_output_dir: data/dicom/fixtures
    max_file_size_bytes: 10485760
    max_files: 200
    accepted_modality: CT
    required_metadata:
      - StudyInstanceUID
      - SeriesInstanceUID
      - SOPInstanceUID
      - Modality
      - Rows
      - Columns
      - PixelSpacing
      - ImageOrientationPatient
      - ImagePositionPatient
      - InstanceNumber
    ordering_fallback_policy:
      - image_position_patient
      - slice_location
      - instance_number
      - filename
    private_tag_policy:
      default_action: remove
      allowlist: []
    deidentification:
      policy_version: research-fixture-policy-v0.3.0
      uid_root: "1.2.826.0.1.3680043.10.54321"
      patient_id_prefix: RSP
      overwrite: false
      burned_in_annotation_error_values:
        - "YES"
  dicom_quality_control:
    policy_version: dicom-qc-policy-v0.4.0
    output_dir: data/dicom/quality
    accepted_modalities:
      - CT
    body_region_allowlist:
      - ABDOMEN
      - ABD
      - ABDOMINAL
    require_body_part_examined: true
    pixel_spacing_tolerance: 0.001
    slice_thickness_tolerance: 0.001
    orientation_tolerance: 0.0001
    slice_gap_tolerance: 0.01
    minimum_slice_count: 2
    maximum_slice_count: 1000
    maximum_corrupt_file_ratio: 0.0
    burned_in_annotation_policy: reject_yes_warn_missing
    private_tag_policy: warn_before_deidentification_error_after
    supported_transfer_syntaxes:
      - "1.2.840.10008.1.2.1"
    pixel_value_bounds:
      - -4096
      - 4096
    scoring_weights:
      INFO: 0
      WARNING: 5
      ERROR: 25
      CRITICAL: 100
    status_thresholds:
      pass_minimum: 95
      fail_below: 70
    critical_rule_ids:
      - DICOM-QC-PHI-001
safeguards:
  - Do not commit DICOM studies, NIfTI volumes, credentials, or restricted labels.
  - Dataset provenance must be documented before use.
future_capabilities:
  - Dataset manifests.
  - Dataset cards.
  - Synthetic longitudinal CT examples.
