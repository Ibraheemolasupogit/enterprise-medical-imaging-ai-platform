config_name: localisation
milestone: 7
status: foundation
purpose: Baseline atlas-style adrenal-region placeholder localisation for synthetic engineering data.
owner: machine-learning
settings:
  localisation:
    policy_version: "m7-localisation-v1"
    default_mode: atlas
    axis_order: "z,y,x"
    left_relative_centre: [0.5, 0.375, 0.3125]
    right_relative_centre: [0.5, 0.375, 0.6875]
    left_physical_offset_mm: [0.0, 0.0, 0.0]
    right_physical_offset_mm: [0.0, 0.0, 0.0]
    roi_size_voxels: [10, 10, 10]
    roi_size_mm: null
    padding_value: 0.0
    maximum_padding_fraction: 0.25
    maximum_centre_distance_mm: 4.0
    minimum_target_coverage: 0.95
    minimum_box_iou: 0.08
    left_right_minimum_separation_mm: 8.0
    confidence_weights:
      padding_fraction: 1.0
    quality_status_policy:
      invalid_geometry: REJECTED
      empty_roi: FAILED
      left_right_swap: FAILED
      missing_ground_truth: NOT_EVALUATED
    output_directory: data/processed/localisation
    overwrite: false
safeguards:
  - Localisation is a deterministic atlas/geometry baseline, not a learned model.
  - Synthetic masks are engineering placeholders and are not clinical adrenal annotations.
  - Outputs are for research engineering review only and must not be used diagnostically.
future_capabilities:
  - MONAI/PyTorch trainable adrenal-region localisation.
  - Public de-identified dataset adapters.
  - Human review workflows for downstream model development.
