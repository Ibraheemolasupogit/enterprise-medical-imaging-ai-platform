{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "medical-imaging-platform.fullname" . }}-api
  labels:
    {{- include "medical-imaging-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
---
{{- end }}
{{- if .Values.reviewerUi.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "medical-imaging-platform.fullname" . }}-reviewer-ui
  labels:
    {{- include "medical-imaging-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: reviewer-ui
spec:
  minAvailable: {{ .Values.reviewerUi.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: reviewer-ui
{{- end }}
