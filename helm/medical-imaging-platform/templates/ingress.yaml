{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "medical-imaging-platform.fullname" . }}
  labels:
    {{- include "medical-imaging-platform.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules: []
{{- end }}
