{{- if .Values.global.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "medical-imaging-platform.serviceAccountName" . }}
  labels:
    {{- include "medical-imaging-platform.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.global.serviceAccount.automountServiceAccountToken }}
{{- end }}
