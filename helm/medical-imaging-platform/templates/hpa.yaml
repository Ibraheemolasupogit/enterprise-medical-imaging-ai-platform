{{- if .Values.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "medical-imaging-platform.fullname" . }}-api
  labels:
    {{- include "medical-imaging-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "medical-imaging-platform.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
    {{- if .Values.api.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
---
{{- end }}
{{- if .Values.reviewerUi.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "medical-imaging-platform.fullname" . }}-reviewer-ui
  labels:
    {{- include "medical-imaging-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: reviewer-ui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "medical-imaging-platform.fullname" . }}-reviewer-ui
  minReplicas: {{ .Values.reviewerUi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.reviewerUi.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.reviewerUi.autoscaling.targetCPUUtilizationPercentage }}
    {{- if .Values.reviewerUi.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.reviewerUi.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
