apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "medical-imaging-platform.fullname" . }}-config
  labels:
    {{- include "medical-imaging-platform.labels" . | nindent 4 }}
data:
  MEDICAL_IMAGING_API_CONFIG: {{ .Values.api.config.path | quote }}
  PLATFORM_ENVIRONMENT: {{ .Values.api.config.environment | quote }}
  PLATFORM_LOG_LEVEL: {{ .Values.api.config.logLevel | quote }}
  REVIEWER_API_BASE_URL: {{ default (printf "http://%s-api:%v" (include "medical-imaging-platform.fullname" .) .Values.api.service.port) .Values.reviewerUi.config.apiBaseUrl | quote }}
