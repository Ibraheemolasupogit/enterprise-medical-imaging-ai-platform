services:
  api:
    image: medical-imaging-api:0.1.0-m13-local
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      args:
        BUILD_DATE: "1970-01-01T00:00:00Z"
        SOURCE_REVISION: "local"
        VERSION: "0.1.0"
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - medical-imaging-local
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    mem_limit: 2g
    cpus: 2.0
    restart: "no"
    volumes:
      - type: bind
        source: ./config/container/api.yaml
        target: /app/config/api.yaml
        read_only: true
      - type: bind
        source: ./config/longitudinal.yaml
        target: /app/config/longitudinal.yaml
        read_only: true
      - type: bind
        source: ./ml/experiments
        target: /app/evidence
        read_only: true
      - type: bind
        source: ./ml/experiments
        target: /app/checkpoints
        read_only: true
      - type: bind
        source: ./reports/generated/container-api
        target: /app/outputs
        read_only: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  reviewer-ui:
    image: medical-imaging-reviewer-ui:0.1.0-m13-local
    build:
      context: .
      dockerfile: docker/reviewer-ui/Dockerfile
      args:
        BUILD_DATE: "1970-01-01T00:00:00Z"
        SOURCE_REVISION: "local"
        VERSION: "0.1.0"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    networks:
      - medical-imaging-local
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
    volumes:
      - type: bind
        source: ./config/container/reviewer_ui.yaml
        target: /app/config/reviewer_ui.yaml
        read_only: true
      - type: bind
        source: ./reports/generated/reviewer-sessions
        target: /app/outputs
        read_only: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  medical-imaging-local:
    name: medical-imaging-local
    driver: bridge
