name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run quality checks
        run: make quality

  container-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate container configuration
        run: make validate-containers

      - name: Lint Dockerfiles and Compose policy
        run: make lint-dockerfiles

      - name: Scan repository secrets
        run: make scan-secrets

      - name: Scan Python dependencies
        run: make scan-dependencies

  kubernetes-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate Helm chart and values
        run: make validate-helm

      - name: Render Kubernetes manifests
        run: make render-kubernetes

      - name: Validate Kubernetes policy
        run: make validate-kubernetes-policy

      - name: Build Kubernetes evidence
        run: make build-kubernetes-evidence

      - name: Validate Kubernetes evidence
        run: make validate-kubernetes-evidence

  aws-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check Terraform formatting
        run: make terraform-fmt-check

      - name: Initialise Terraform without backend
        run: make terraform-init

      - name: Validate Terraform
        run: make terraform-validate

      - name: Validate AWS policy
        run: make validate-aws-policy

      - name: Run optional Terraform scanners
        run: make scan-terraform

      - name: Build AWS evidence
        run: make build-aws-evidence

      - name: Validate AWS evidence
        run: make validate-aws-evidence

  image-build-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build local images
        run: make build-images

      - name: Generate SBOM evidence
        run: make generate-sbom

      - name: Scan local images
        run: make scan-images

      - name: Run container smoke test
        run: make container-smoke

      - name: Build release evidence
        run: make build-release-evidence

      - name: Validate release evidence
        run: make validate-release-evidence

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: local-release-evidence
          path: reports/generated/releases
          if-no-files-found: error

  portfolio-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Terraform for static checks
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build and validate final portfolio readiness evidence
        run: make portfolio-readiness

      - name: Upload portfolio evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-readiness-evidence
          path: reports/generated/portfolio
          if-no-files-found: error
