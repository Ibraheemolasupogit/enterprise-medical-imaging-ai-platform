name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  PIP_AUDIT_VERSION: "2.9.0"
  SYFT_VERSION: "1.18.1"
  TRIVY_VERSION: "0.72.0"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-quality.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci-quality.txt

      - name: Run quality checks
        run: make quality

  container-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-quality.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci-quality.txt
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Validate container configuration
        run: make validate-containers

      - name: Lint Dockerfiles and Compose policy
        run: make lint-dockerfiles

      - name: Scan repository secrets
        run: make scan-secrets

      - name: Scan Python dependencies
        run: make scan-dependencies

  kubernetes-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-quality.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci-quality.txt

      - name: Validate Helm chart and values
        run: make validate-helm

      - name: Render Kubernetes manifests
        run: make render-kubernetes

      - name: Validate Kubernetes policy
        run: make validate-kubernetes-policy

      - name: Build Kubernetes evidence
        run: make build-kubernetes-evidence

      - name: Validate Kubernetes evidence
        run: make validate-kubernetes-evidence

  aws-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-quality.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci-quality.txt

      - name: Check Terraform formatting
        run: make terraform-fmt-check

      - name: Initialise Terraform without backend
        run: make terraform-init

      - name: Validate Terraform
        run: make terraform-validate

      - name: Validate AWS policy
        run: make validate-aws-policy

      - name: Run optional Terraform scanners
        run: make scan-terraform

      - name: Build AWS evidence
        run: make build-aws-evidence

      - name: Validate AWS evidence
        run: make validate-aws-evidence

  image-build-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-quality.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci-quality.txt

      - name: Install Syft and Trivy
        run: |
          curl -sSfL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" -o /tmp/syft.tar.gz
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
          sudo install -m 0755 /tmp/syft /usr/local/bin/syft
          syft version
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Build local images
        run: make build-images

      - name: Generate SBOM evidence
        run: make generate-sbom

      - name: Scan local images
        run: make scan-images

      - name: Run container smoke test
        run: make container-smoke

      - name: Build release evidence
        run: make build-release-evidence

      - name: Validate release evidence
        run: make validate-release-evidence

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-release-evidence
          path: reports/generated/releases
          if-no-files-found: error

  portfolio-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-quality.txt

      - name: Set up Terraform for static checks
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci-quality.txt

      - name: Build and validate final portfolio readiness evidence
        run: make portfolio-readiness

      - name: Upload portfolio evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-readiness-evidence
          path: reports/generated/portfolio
          if-no-files-found: error
